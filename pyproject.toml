[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI terminal presentation layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
local-llm = ["mlx-lm>=0.25.2"]

[project.scripts]
sentinel = "cli.app:app"

[tool.setuptools.packages.find]
include = ["cli*", "models*", "schemas*", "utils*"]
