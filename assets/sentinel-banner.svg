<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SentinelAI animated governance banner</title>
  <desc id="desc">A dark teal animated security grid with a glowing shield and the SentinelAI title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081A26"/>
      <stop offset="0.55" stop-color="#0B2D37"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="40" x2="1060" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6BE"/>
      <stop offset="0.52" stop-color="#8BF3D2"/>
      <stop offset="1" stop-color="#7AA2F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 90) rotate(135) scale(360)">
      <stop stop-color="#55D6BE" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#55D6BE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8BF3D2" stroke-opacity="0.08"/>
    </pattern>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 5s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .orbit { animation: orbit 9s linear infinite; transform-origin: 946px 151px; }
      .orbit-reverse { animation: orbit 13s linear infinite reverse; transform-origin: 946px 151px; }
      .signal { animation: signal 2.4s ease-out infinite; transform-origin: 946px 151px; }
      .node { animation: node 2.2s ease-in-out infinite; }
      .flow { animation: flow 3.4s linear infinite; }
      .flow-slow { animation: flow 5.2s linear infinite reverse; }
      .spark { animation: spark 2.8s ease-in-out infinite; transform-origin: center; }
      .ticker { animation: ticker 7s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @keyframes scan { 0% { transform: translateX(-420px); opacity:0; } 15%,70% { opacity:.8; } 100% { transform: translateX(520px); opacity:0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes signal { 0% { transform: scale(.35); opacity:.7; } 100% { transform: scale(1.35); opacity:0; } }
      @keyframes node { 0%,100% { opacity:.25; r:2; } 50% { opacity:1; r:4; } }
      @keyframes flow { from { stroke-dashoffset:120; } to { stroke-dashoffset:0; } }
      @keyframes spark { 0%,100% { opacity:.15; transform:scale(.65); } 50% { opacity:1; transform:scale(1.2); } }
      @keyframes ticker { 0%,18% { opacity:0; transform:translateX(-18px); } 24%,78% { opacity:1; transform:translateX(0); } 100% { opacity:0; transform:translateX(18px); } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="940" cy="90" r="280" fill="url(#glow)" filter="url(#blur)"/>
  <path class="scan" d="M-100 310L420 -40" stroke="#55D6BE" stroke-width="2" stroke-opacity=".8"/>
  <path class="flow" d="M384 106C520 106 560 106 692 146S790 186 858 166" stroke="#55D6BE" stroke-width="2" stroke-dasharray="8 12" stroke-opacity=".55" fill="none"/>
  <path class="flow-slow" d="M410 236C532 236 624 250 738 212S812 174 872 174" stroke="#7AA2F7" stroke-width="2" stroke-dasharray="5 14" stroke-opacity=".45" fill="none"/>
  <path d="M0 286H1200" stroke="#55D6BE" stroke-opacity=".12"/>
  <g class="float" filter="url(#shadow)">
    <path d="M946 58L1018 84V145C1018 204 976 244 946 259C916 244 874 204 874 145V84L946 58Z" fill="#0D3B44" stroke="url(#accent)" stroke-width="3"/>
    <path class="pulse" d="M912 151L936 175L983 121" stroke="#8BF3D2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="946" cy="151" r="91" stroke="#55D6BE" stroke-opacity=".25" stroke-width="2" stroke-dasharray="5 10"/>
  </g>
  <g class="orbit"><circle cx="946" cy="58" r="4" fill="#8BF3D2"/><circle cx="1037" cy="151" r="3" fill="#7AA2F7"/></g>
  <g class="orbit-reverse"><circle cx="874" cy="151" r="3" fill="#8BF3D2"/><circle cx="946" cy="244" r="4" fill="#55D6BE"/></g>
  <g class="signal" fill="none" stroke="#8BF3D2" stroke-width="1.5"><circle cx="946" cy="151" r="75"/><circle cx="946" cy="151" r="96"/></g>
  <g fill="#8BF3D2"><circle class="node" cx="830" cy="66" r="3"/><circle class="node" cx="1082" cy="242" r="3" style="animation-delay:.7s"/><circle class="node" cx="1120" cy="100" r="2" style="animation-delay:1.3s"/></g>
  <g class="spark" fill="#55D6BE"><circle cx="700" cy="146" r="5"/><circle cx="758" cy="200" r="3" style="animation-delay:.8s"/></g>
  <text x="84" y="119" fill="#8BF3D2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="4">AI GOVERNANCE / FINANCIAL SYSTEMS</text>
  <text x="80" y="190" fill="white" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">SentinelAI</text>
  <text x="86" y="231" fill="#B8D2D4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Guardrails for decisions that matter.</text>
  <rect x="84" y="270" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text x="84" y="307" fill="#7D9A9F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">POLICY  •  RISK  •  FRAUD  •  AUDIT</text>
  <g class="ticker"><rect x="530" y="286" width="232" height="30" rx="15" fill="#0A3039" stroke="#55D6BE" stroke-opacity=".38"/><circle cx="550" cy="301" r="4" fill="#55D6BE"/><text x="564" y="306" fill="#B8D2D4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">RULE TRACE · LIVE</text></g>
</svg>
